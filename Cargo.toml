[package]
name = "arclang"
version = "4.12.0"
edition = "2021"
authors = ["ArcLang Contributors"]
description = "Industrial-grade Arcadia-as-Code compiler with Phase 1 & 2 Rendering Pipeline"
license = "MIT"
repository = "https://github.com/arclang/arclang"
keywords = ["arcadia", "mbse", "systems-engineering", "compiler", "capella"]
categories = ["development-tools", "compilers"]

[features]
# The compiler core is dependency-light and compiles to wasm32; everything
# that needs an OS (CLI, LSP, web server) lives behind `native` (default).
default = ["native"]
native = [
    "dep:clap", "dep:colored", "dep:opener",
    "dep:axum", "dep:tower", "dep:tower-http",
    "dep:tokio", "dep:async-trait", "dep:tower-lsp",
    "dep:tracing", "dep:tracing-subscriber",
    "dep:reqwest",
    "dep:toml", "dep:bincode",
    "dep:rayon", "dep:rand", "dep:config", "dep:indicatif",
    "dep:parquet", "dep:rumqttc", "dep:async-opcua", "dep:futures",
    "dep:rskafka", "dep:rustls", "dep:rustls-native-certs",
]

[[bin]]
name = "arclang"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
# ---- Compiler core (wasm-compatible) ----
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
sha2 = "0.11"
petgraph = "0.8"
regex = "1.10"
quick-xml = "0.42"
unicode-normalization = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# v5 only: deterministic identity must not depend on an entropy source
uuid = { version = "1.6", features = ["v5", "serde"] }

# ---- Native only (CLI / LSP / web server) ----
clap = { version = "4.4", features = ["derive", "cargo"], optional = true }
colored = { version = "3.1", optional = true }
opener = { version = "0.9", optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
toml = { version = "1.1", optional = true }
bincode = { version = "3.0", optional = true }
tokio = { version = "1.35", features = ["full"], optional = true }
async-trait = { version = "0.1", optional = true }
tower-lsp = { version = "0.20", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
# TLS by rustls (ring) and the system's roots: no OpenSSL, so the Linux binary needs no libssl.
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "charset", "http2", "rustls-tls-native-roots"], optional = true }
rayon = { version = "1.8", optional = true }
rand = { version = "0.10", optional = true }
# Monte Carlo verification: laws, quantiles, Clopper-Pearson; seeded samples.
statrs = { version = "0.19", default-features = false }
rand_chacha = "0.9"
config = { version = "0.15", optional = true }
indicatif = { version = "0.18", optional = true }
# Digital twins: measurements in Parquet; live data over MQTT.
parquet = { version = "60", default-features = false, features = ["snap", "zstd", "lz4"], optional = true }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"], optional = true }
async-opcua = { version = "0.19", default-features = false, features = ["client"], optional = true }
futures = { version = "0.3", optional = true }
rskafka = { version = "0.6", features = ["transport-tls"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3.8"
mockall = "0.15"
proptest = "1.4"
jsonschema = { version = "0.60.1", default-features = false }
serde_yaml = "0.9.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
