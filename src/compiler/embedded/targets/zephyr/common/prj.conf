# ArcLang: the subsystems arclang_io_zephyr.c may call. A board without a
# device for one leaves it unused (the channel answers ARCLANG_IO_ERR_CHANNEL).
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_CAN=y
CONFIG_SERIAL=y
CONFIG_WATCHDOG=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
CONFIG_MAIN_STACK_SIZE=4096
# The tasks of several io_bindings: a priority each (1 the highest, the kernel's 0).
CONFIG_NUM_PREEMPT_PRIORITIES=32
