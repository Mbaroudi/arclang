<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>workbench harness</title>
<link rel="stylesheet" href="viewer/arcviz-viewer.css"><link rel="stylesheet" href="workbench.css">
<style>
:root{--vscode-editor-background:#ffffff;--vscode-editor-foreground:#1f1f1f;--vscode-font-family:-apple-system,system-ui,sans-serif;--vscode-font-size:13px;--vscode-descriptionForeground:#616161;--vscode-focusBorder:#005fb8;--vscode-errorForeground:#f85149;--vscode-sideBar-background:#f8f8f8;--vscode-panel-border:#e5e5e5;--vscode-input-background:#ffffff;--vscode-input-foreground:#3b3b3b;--vscode-input-border:#cecece;--vscode-button-background:#005fb8;--vscode-button-foreground:#ffffff;--vscode-button-secondaryBackground:#e5e5e5;--vscode-button-secondaryForeground:#3b3b3b;--vscode-button-secondaryHoverBackground:#cccccc;--vscode-textLink-foreground:#005fb8;--vscode-editorWidget-background:#f8f8f8;--vscode-editor-font-family:Menlo,monospace}
:root.dark{--vscode-editor-background:#1f1f1f;--vscode-editor-foreground:#cccccc;--vscode-descriptionForeground:#9d9d9d;--vscode-focusBorder:#0078d4;--vscode-errorForeground:#f85149;--vscode-sideBar-background:#181818;--vscode-panel-border:#2b2b2b;--vscode-input-background:#313131;--vscode-input-foreground:#cccccc;--vscode-input-border:#3c3c3c;--vscode-button-background:#0078d4;--vscode-button-foreground:#ffffff;--vscode-button-secondaryBackground:#313131;--vscode-button-secondaryForeground:#cccccc;--vscode-button-secondaryHoverBackground:#3c3c3c;--vscode-textLink-foreground:#4daafc;--vscode-editorWidget-background:#202020}
</style>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get('theme') === 'dark') document.documentElement.classList.add('dark');
  const model = params.get('model') || 'snapshot';
  window.__posted = [];
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => {
      window.__posted.push(m); console.log('[post]', JSON.stringify(m).slice(0, 300));
      if (m.type === 'ready') {
        Promise.all([fetch(model + '.json').then(r => r.json()), fetch('metamodel.json').then(r => r.json())]).then(([snapshot, metamodel]) => {
          window.postMessage({ type: 'snapshot', snapshot, metamodel, file: model + '.arc', selected: null }, '*');
        });
      }
      if (m.type === 'edit') window.postMessage({ type: 'edit-result', ok: true, label: m.label }, '*');
    },
    getState: () => undefined, setState: () => undefined,
  });
</script>
</head><body>
<div id="workbench" data-file="model.arc"></div>
<script src="viewer/vendor/elk.bundled.js"></script>
<script src="viewer/arcviz-render.js"></script><script src="viewer/arcviz-links.js"></script><script src="viewer/arcviz-navigation.js"></script><script src="viewer/arcviz-collapse.js"></script><script src="viewer/arcviz-scope.js"></script><script src="viewer/arcviz-export.js"></script><script src="viewer/arcviz-stage.js"></script><script src="viewer/arcviz-place.js"></script><script src="viewer/arcviz-edit.js"></script><script src="viewer/arcviz-viewer.js"></script>
<script src="webview.js"></script>
</body></html>
