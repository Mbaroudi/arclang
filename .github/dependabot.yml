# Dependency updates, grouped per ecosystem, once a week.
version: 2
updates:
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    groups:
      vscode-extension:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /mcp-server
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
