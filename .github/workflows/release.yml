name: Release

# Signed, verifiable releases: binaries + SHA256SUMS + GitHub build
# provenance attestations. Qualified environments pin a tag and verify
# both (docs/qualification/TOOL_QUALIFICATION.md §7, docs/VERSIONING.md).

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: arclang-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: arclang-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: arclang-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        run: cargo test
        if: matrix.target != 'x86_64-apple-darwin'

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cp target/${{ matrix.target }}/release/arclang ${{ matrix.asset }}
          tar czf ${{ matrix.asset }}.tar.gz ${{ matrix.asset }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ matrix.asset }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.tar.gz

  vscode:
    name: Build the VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The extension also runs in the browser (VS Code for the Web, the playground), on the
      # compiler built to WebAssembly: the .vsix carries it.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build the compiler for the browser
        run: |
          cargo install wasm-pack --locked --version 0.15.0
          cd wasm && wasm-pack build --target web --release

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Package the .vsix
        working-directory: editors/vscode
        run: |
          npm ci
          npm run typecheck
          npm run test:unit
          npx @vscode/vsce package --no-dependencies -o arclang-vscode-${GITHUB_REF_NAME}.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arclang-vscode
          path: editors/vscode/arclang-vscode-*.vsix

  # Publishes the same .vsix to the Visual Studio Marketplace and to Open VSX
  # when the tokens are configured as repository secrets. Without them the
  # steps are skipped and the .vsix is still attached to the GitHub release.
  vscode-registries:
    name: Publish the VS Code extension to the registries
    needs: vscode
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download the .vsix
        uses: actions/download-artifact@v4
        with:
          name: arclang-vscode

      - name: Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce@4 publish --packagePath arclang-vscode-*.vsix

      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@1 publish arclang-vscode-*.vsix

  release:
    name: Publish release
    needs: [build, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum arclang-*.tar.gz arclang-vscode-*.vsix > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "ArcLang ${GITHUB_REF_NAME}" \
            --generate-notes \
            arclang-*.tar.gz arclang-vscode-*.vsix SHA256SUMS
