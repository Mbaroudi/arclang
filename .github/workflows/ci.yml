name: CI

on:
  push:
    branches: [ main, develop, v3-foundation ]
  pull_request:
    branches: [ main, develop, v3-foundation ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Includes the golden corpus (tests/examples_compile.rs): every active
      # example must compile, and the flagship model must extract real elements.
      - name: Run tests
        run: cargo test

      - name: Run doc tests
        run: cargo test --doc

  # The embedded chain's checks that need cppcheck (MISRA addon) and fmpy,
  # pinned in tools/embedded/Dockerfile: run in that image.
  embedded:
    name: Embedded chain (MISRA, FMU) in its image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t arclang-embedded:1 tools/embedded

      - name: Run the embedded tests, the tool-dependent ones included
        run: tools/embedded/run.sh cargo test --test embedded_c -- --include-ignored

  # Processor in the loop: Zephyr for the LiteX VexRiscv SoC, run in Renode,
  # pinned in tools/embedded/soc/Dockerfile (on top of the embedded image).
  embedded-soc:
    name: Embedded SoC (Zephyr, Renode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the images
        run: |
          docker build -t arclang-embedded:1 tools/embedded
          docker build -t arclang-embedded-soc:1 tools/embedded/soc

      - name: Run the target and PIL tests, the Renode runs included
        run: tools/embedded/soc/run.sh cargo test --test embedded_soc -- --include-ignored

  # The programmable logic: VHDL in GHDL against the fixed-point C, and
  # synthesis for the ECP5 (Yosys with the GHDL plugin, nextpnr-ecp5,
  # ecppack), pinned in tools/embedded/fpga/Dockerfile (on top of the
  # embedded image).
  embedded-fpga:
    name: Embedded FPGA (GHDL, Yosys, nextpnr)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the images
        run: |
          docker build -t arclang-embedded:1 tools/embedded
          docker build -t arclang-embedded-fpga:1 tools/embedded/fpga

      - name: Run the FPGA tests, the GHDL runs and the synthesis included
        run: tools/embedded/fpga/run.sh cargo test --release --test embedded_fpga -- --include-ignored

  # The processor and the logic together: a LiteX SoC (VexRiscv, Zephyr, the
  # generated blocks) simulated cycle by cycle in Verilator, and the same SoC
  # built into one bitstream for the ULX3S. The system image takes Zephyr
  # from the SoC image and GHDL, Yosys and nextpnr from the FPGA image.
  embedded-system:
    name: Embedded system (LiteX SoC, Verilator, bitstream)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Four images, about 10 GB: room made from the runner's SDKs this job does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the images
        run: |
          docker build -t arclang-embedded:1 tools/embedded
          docker build -t arclang-embedded-soc:1 tools/embedded/soc
          docker build -t arclang-embedded-fpga:1 tools/embedded/fpga
          docker build -t arclang-embedded-system:1 tools/embedded/system

      - name: Run the system tests, the simulated SoC and the bitstream included
        run: tools/embedded/system/run.sh cargo test --release --test embedded_system -- --include-ignored --test-threads=3

  examples:
    name: Compile all active examples (CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-examples-${{ hashFiles('**/Cargo.lock') }}

      - name: Build compiler
        run: cargo build --release

      - name: Compile every active example through the CLI
        run: |
          set -e
          fail=0
          while IFS= read -r -d '' f; do
            if ./target/release/arclang build "$f" > /dev/null 2>&1; then
              echo "OK   $f"
            else
              echo "FAIL $f"
              ./target/release/arclang build "$f" || true
              fail=1
            fi
          done < <(find examples -name '*.arc' -not -path 'examples/archive/*' -print0)
          exit $fail

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Lays out and draws the viewpoint diagrams of every example with the
      # layout engine and renderer shipped in the HTML viewer (no npm install:
      # both are vendored in the repository).
      - name: Lay out and draw every example's diagrams
        run: ARCLANG=target/release/arclang tools/diagram_render/check.sh

  capella-roundtrip:
    name: Capella round-trip (zero diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-roundtrip-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install capellambse
        run: |
          python -m venv tools/capella_bridge/.venv
          tools/capella_bridge/.venv/bin/pip install -r tools/capella_bridge/requirements.txt

      - name: Build compiler
        run: cargo build --release

      # Capella -> .arc -> strict compile -> apply back must be BYTE-IDENTICAL
      - name: Round-trip zero-diff test
        run: |
          tools/capella_bridge/roundtrip_test.sh \
            "tests/fixtures/capella/test7_0" "Model Test 7.0.aird" \
            ./target/release/arclang

      # Editing workflows: description/requirement edits, component
      # creation (--create-missing) and deletion (--delete-missing)
      - name: Workflow test (edit/create/delete)
        run: |
          tools/capella_bridge/workflow_test.sh \
            "tests/fixtures/capella/test7_0" "Model Test 7.0.aird" \
            ./target/release/arclang

  build:
    name: Build Release
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: arclang-${{ runner.os }}
          path: target/release/arclang

  mcp-server:
    name: MCP server against the real compiler
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The server supports both generations of the MCP Python SDK.
        mcp: ["mcp>=1.2,<2", "mcp>=2"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mcp-${{ hashFiles('**/Cargo.lock') }}

      - name: Build compiler
        run: cargo build --release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the server
        run: pip install -e "mcp-server[dev]" "${{ matrix.mcp }}"

      # The tests run target/release/arclang: every tool, the syntax rules and
      # the reference model against the compiler, and a session over stdio.
      - name: Test
        working-directory: mcp-server
        run: pytest

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            wasm/target
          key: ${{ runner.os }}-cargo-vscode-${{ hashFiles('**/Cargo.lock') }}

      - name: Build compiler
        run: cargo build --release

      # The extension also runs in the browser, on the compiler built to WebAssembly (wasm/pkg).
      - name: Build the compiler for the browser
        run: |
          cargo install wasm-pack --locked --version 0.15.0
          cd wasm && wasm-pack build --target web --release

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install the extension's dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Audit the runtime dependencies
        working-directory: editors/vscode
        run: npm audit --omit=dev --audit-level=high

      - name: Type-check, bundle and unit tests
        working-directory: editors/vscode
        run: |
          npm run typecheck
          npm run build
          npm run test:unit

      # The sample model the assistant is shown must compile and pass the gate.
      - name: The sample model compiles and passes the gate
        run: |
          ./target/release/arclang check editors/vscode/media/reference.arc
          ./target/release/arclang gate editors/vscode/media/reference.arc

      # In a VS Code instance: activation, commands, language model tools,
      # the language server's diagnostics and the formatter, with the compiler
      # built above.
      - name: Integration tests
        working-directory: editors/vscode
        env:
          ARCLANG_BINARY: ${{ github.workspace }}/target/release/arclang
        run: xvfb-run -a npm run test:integration

      - name: Package the .vsix
        working-directory: editors/vscode
        run: npx @vscode/vsce package --no-dependencies -o arclang-vscode.vsix

      - name: Upload the .vsix
        uses: actions/upload-artifact@v7
        with:
          name: arclang-vscode
          path: editors/vscode/arclang-vscode.vsix

  security-audit:
    name: Dependency audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

# NOTE (v3 honesty policy): the previous workflow ran `cargo clippy -- -D
# warnings`, cargo-tarpaulin coverage, and a "safety analysis" job that
# uploaded PDF/CSV artifacts the CLI never produced. They are removed until
# they can actually pass: clippy cleanup is tracked for M2+, coverage will
# return with cargo-llvm-cov, and safety reports will return when
# `arclang safety --report` is implemented for real.
